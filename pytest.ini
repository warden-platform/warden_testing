[pytest]
addopts = -ra --strict-markers --reruns 1 --reruns-delay 1
testpaths = case
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    smoke: 冒烟用例，覆盖健康检查、登录、租户与项目
    connector: 需要测试 Connector 的用例
    security: 越权、租户隔离、签名等安全用例
    approval: 审批链路用例
    slow: 耗时较长的用例
    federated: 联邦断言登录用例
    ai: AI 助手用例
    oidc: OIDC（假 IdP）登录用例
    dingtalk: 钉钉通知渠道/租户隔离用例
    ui: UI 冒烟（playwright）