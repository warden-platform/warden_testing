name: warden-ui-smoke

# UI 冒烟：起控制面 + 前端 dev server，用 Playwright 驱动浏览器验证登录链路。
# 依赖前端构建（npm install，较慢），独立于 API 黑盒测试，手动触发为主。
on:
  workflow_dispatch:

jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: warden
          POSTGRES_USER: warden
          POSTGRES_PASSWORD: warden
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U warden"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout warden_testing
        uses: actions/checkout@v4

      - name: Checkout warden control plane
        uses: actions/checkout@v4
        with:
          repository: warden-platform/warden
          path: warden

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: warden/server/go.mod
          cache-dependency-path: warden/server/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install psql client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Initialize warden config & secrets
        working-directory: warden
        run: |
          scripts/init-local-secrets.sh
          cat > config.yaml <<'YAML'
          server:
            port: 8080
            public_url: http://localhost:8080
            cors_origin: http://localhost:4173
            cookie_secure: false
          database:
            url: postgres://localhost:5432/warden
            username: warden
            password: ${WARDEN_DATABASE_PASSWORD}
          admin:
            username: admin
            password: ${WARDEN_ADMIN_PASSWORD}
          oidc:
            enabled: false
          ai:
            enabled: false
          YAML
          cat > .env <<'ENV'
          WARDEN_ADMIN_PASSWORD=e2e-admin-pass-123
          WARDEN_DATABASE_PASSWORD=warden
          ENV
          chmod 600 .env

      - name: Run database migrations
        run: |
          for f in warden/server/migrations/*.sql; do
            PGPASSWORD=warden psql -h localhost -U warden -d warden \
              -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: Build control plane
        working-directory: warden/server
        run: go build -o bin/warden-control ./cmd/warden-control

      - name: Start control plane
        working-directory: warden
        run: |
          nohup ./server/bin/warden-control > /tmp/warden-control.log 2>&1 &
          echo $! > warden-control.pid
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/v1/health >/dev/null 2>&1; then
              echo "control plane ready"
              exit 0
            fi
            sleep 1
          done
          echo "control plane failed to start; last log:" >&2
          tail -n 40 /tmp/warden-control.log >&2 || true
          exit 1

      - name: Start web dev server
        working-directory: warden/web
        run: |
          npm install
          nohup npm run dev > /tmp/warden-web.log 2>&1 &
          echo $! > web.pid
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:4173/ >/dev/null 2>&1; then
              echo "web dev server ready"
              exit 0
            fi
            sleep 1
          done
          echo "web dev server failed to start; last log:" >&2
          tail -n 40 /tmp/warden-web.log >&2 || true
          exit 1

      - name: Install test dependencies + Playwright
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run UI smoke
        env:
          WARDEN_HOME: ${{ github.workspace }}/warden
          WARDEN_TEST_UI_ENABLED: "1"
        run: |
          pytest -m ui --alluredir=allure-results

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: warden-ui-results
          path: |
            allure-results